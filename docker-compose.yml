# Secrets come from .env (copy .env.example). Postgres and Redis listen
# on 127.0.0.1 only: reachable from this machine, never from the network.
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-atomfield_db}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      # $$ defers expansion to the container, which has these variables.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Append-only file: the queue survives restarts instead of vanishing.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --appendonly
      - "yes"
    environment:
      # redis-cli reads this, so the health check can authenticate.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    # Migrate (with a backup when needed) first; exec hands PID 1 to
    # uvicorn so it receives stop signals.
    command:
      - sh
      - -c
      - >-
        uv run --python 3.11 python -m app.db.migrate
        && exec uv run --python 3.11 uvicorn app.main:app
        --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ARTIFACTS_DIR: /app/artifacts
      BACKUP_DIR: /app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations:ro
      - ./scripts_repo:/app/scripts_repo:ro
      - ./artifacts:/app/artifacts
      - ./backups:/app/backups
    restart: unless-stopped

  worker:
    build: .
    command: uv run --python 3.11 arq app.worker.settings.WorkerConfig
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Absolute host paths, for containers the worker starts via the
      # host's Docker daemon.
      HOST_SCRIPTS_DIR: ${PWD}/scripts
      HOST_ARTIFACTS_DIR: ${PWD}/artifacts
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./app:/app/app
      - ./scripts_repo:/app/scripts_repo:ro
      - ./artifacts:/app/artifacts
      - ${PWD}/artifacts:${PWD}/artifacts
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
