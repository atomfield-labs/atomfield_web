version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: atomfield_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    # Industry standard: healthcheck to prevent startup race conditions
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d atomfield_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/atomfield_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: uv run arq app.worker.settings.WorkerConfig
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/atomfield_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Passes the absolute path of the current directory on the host machine
      HOST_SCRIPTS_DIR: ${PWD}/scripts
      HOST_ARTIFACTS_DIR: ${PWD}/artifacts
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}/artifacts:${PWD}/artifacts
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
