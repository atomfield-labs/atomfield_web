# Secrets come from .env (copy .env.example). Postgres and Redis listen
# on 127.0.0.1 only: reachable from this machine, never from the network.
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-atomfield_db}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      # $$ defers expansion to the container, which has these variables.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Append-only file: the queue survives restarts instead of vanishing.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --appendonly
      - "yes"
    environment:
      # redis-cli reads this, so the health check can authenticate.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    # Migrate (with a backup when needed) first; exec hands PID 1 to
    # uvicorn so it receives stop signals. Live event streams never end
    # on their own, and uvicorn waits for open responses before it
    # stops, so it must be told to give up on them; browsers reconnect
    # to the new process and get a fresh snapshot.
    command:
      - sh
      - -c
      - >-
        uv run --python 3.11 python -m app.db.migrate
        && exec uv run --python 3.11 uvicorn app.main:app
        --host 0.0.0.0 --port 8000 --timeout-graceful-shutdown 5
    # This machine only: whatever gives the server its https name forwards
    # here. If that runs on another machine, set API_BIND in .env.
    ports:
      - "${API_BIND:-127.0.0.1}:8000:8000"
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ARTIFACTS_DIR: /app/artifacts
      STORAGE_DIR: /app/storage
      BACKUP_DIR: /app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations:ro
      - ./artifacts:/app/artifacts
      # Releases, data packs and uploads: outside the container, or
      # rebuilding it would lose them while the database still lists them.
      - ./storage:/app/storage
      - ./backups:/app/backups
    restart: unless-stopped

  # The house agent: the same program users run on their own machines,
  # here running jobs for the house compute target. It talks only to
  # the API over HTTP; it needs no database or Redis access.
  # Off unless asked for (docker compose --profile house up): this image
  # holds no scientific programs, so it runs only tasks that need none.
  agent:
    profiles: ["house"]
    build: .
    command: uv run --python 3.11 python -m agent
    environment:
      ATOMFIELD_API_URL: http://api:8000
      ATOMFIELD_AGENT_TOKEN: ${HOUSE_AGENT_TOKEN:-}
      ARTIFACTS_DIR: /app/artifacts
      # Our disk, not the user's: once a run's zip is uploaded (users
      # download that), its folder here is removed.
      ATOMFIELD_DELETE_AFTER_UPLOAD: "true"
    # No docker.sock: the agent runs catalog tasks as plain processes,
    # and access to the Docker daemon would equal root on the host.
    volumes:
      - ./app:/app/app
      - ./agent:/app/agent
      - ./artifacts:/app/artifacts
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
