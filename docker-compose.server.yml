# For a server that runs a published image instead of a copy of the code
# (docs/deploy.md, "From a published image"). On the server, save this as
# docker-compose.yml beside .env and backup.sh: nothing else is needed.
# Unlike docker-compose.yml, it mounts no code: the image holds it all.
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-atomfield_db}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      # $$ defers expansion to the container, which has these variables.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Append-only file: the queue survives restarts instead of vanishing.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --appendonly
      - "yes"
    environment:
      # redis-cli reads this, so the health check can authenticate.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ${ATOMFIELD_IMAGE:?set ATOMFIELD_IMAGE in .env}
    # Migrate (with a backup when needed) first, then serve; see
    # docker-compose.yml for why uvicorn is told to stop promptly.
    command:
      - sh
      - -c
      - >-
        uv run --python 3.11 python -m app.db.migrate
        && exec uv run --python 3.11 uvicorn app.main:app
        --host 0.0.0.0 --port 8000 --timeout-graceful-shutdown 5
    # This machine only: whatever gives the server its https name forwards
    # here. If that runs on another machine, set API_BIND in .env.
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ARTIFACTS_DIR: /app/artifacts
      STORAGE_DIR: /app/storage
      BACKUP_DIR: /app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./artifacts:/app/artifacts
      # Releases, data packs and uploads: outside the container, so a new
      # image keeps them.
      - ./storage:/app/storage
      - ./backups:/app/backups
    restart: unless-stopped

  # The house agent with Quantum ESPRESSO and Wannier90 (Dockerfile.worker):
  # runs jobs for "AtomField server" under Run on. Off unless asked for:
  # docker compose --profile house up -d
  worker:
    profiles: ["house"]
    image: ${ATOMFIELD_WORKER_IMAGE:-}
    command: ["/app/.venv/bin/python", "-m", "agent", "run"]
    environment:
      ATOMFIELD_API_URL: http://api:8000
      ATOMFIELD_AGENT_TOKEN: ${HOUSE_AGENT_TOKEN:-}
      ATOMFIELD_RUNNER: process
      ATOMFIELD_MAX_JOBS: ${WORKER_MAX_JOBS:-1}
      # A task's CPU count is sized for a cluster node; here each job
      # gets at most what the worker has.
      ATOMFIELD_MAX_CPUS: ${WORKER_CPUS:-2}
      ARTIFACTS_DIR: /work/runs
      # In the volume, so a restart remembers the jobs it was running.
      ATOMFIELD_AGENT_STATE: /work/state/agent-state.json
      # Our disk, not the user's: once a run's zip is uploaded (users
      # download that), its folder here is removed.
      ATOMFIELD_DELETE_AFTER_UPLOAD: "true"
    # No docker.sock: access to the Docker daemon would equal root on
    # the host.
    volumes:
      - ./work:/work
    # MPI ranks share memory through /dev/shm; Docker's 64 MB is too small.
    shm_size: 1gb
    # Leave CPUs for the API and the database.
    cpus: ${WORKER_CPUS:-2}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
