[project]
name = "atomfield"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ujjawalM", email = "ujjawal.m.wal@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.9",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.1.3",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
# E501 is off by default; the 80-character rule is enforced here.
extend-select = ["E501"]
extend-ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts_repo/src"]
addopts = "-m 'not e2e'"
markers = [
    "e2e: needs the full stack running (API, worker, Redis, Postgres)",
]
# pytest-env sets these before any app module is imported, because
# settings are read at import time. "D:" means default only: a variable
# already exported in the shell wins.
env = [
    "D:POSTGRES_DB=atomfield_test",
    "D:REDIS_DB=15",
    "D:ADMIN_API_KEY=af_test_admin_key",
    "D:ARTIFACTS_DIR=.pytest_cache/test-artifacts",
    "D:STORAGE_DIR=.pytest_cache/test-storage",
    "D:STORAGE_SIGNING_KEY=test-storage-signing-key",
    # Tests register many keys from one client; the limit itself is
    # tested by lowering it in test_access_control.py.
    "D:KEY_CREATION_LIMIT_PER_HOUR=1000",
    "D:CATALOG_PATH=tests/fixtures/catalog.json",
    "D:HOUSE_AGENT_TOKEN=af_agent_test_house",
    # Tests run the sweeper explicitly, never in the background.
    "D:SWEEPER_ENABLED=false",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "pytest-env>=1.8.1",
    "requests>=2.34.2",
    "ruff>=0.17.1",
]

