[project]
name = "atomfield"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ujjawalM", email = "ujjawal.m.wal@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "docker>=7.2.0",
    "fastapi>=0.142.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.1.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
atomfield = "atomfield:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
